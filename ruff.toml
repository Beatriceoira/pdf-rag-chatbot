target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "PT", "SIM", "RUF"]
ignore = [
    "BLE001",  # Blind except Exception - acceptable in error handlers
    "G201",    # Logging exception instead of exc_info
    "E402",    # Module level import not at top - needed for sys.path setup
]

[lint.isort]
known-first-party = ["src"]
